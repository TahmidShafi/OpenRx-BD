[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrx-bd"
version = "0.1.0"
description = "Debate-hardened prescription cost-optimization engine for Bangladesh pharmaceuticals"
authors = [{ name = "OpenRx-BD Team" }]
readme = "AGENT.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "polars",
    "pydantic>=2.0",
    "rapidfuzz",
    "fastapi",
    "uvicorn",
    "pytest",
    "typer",
    "pyarrow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --tb=short"
